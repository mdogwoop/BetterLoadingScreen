// Localize the UI by the browser / system language (zh / ja / English fallback).
// Detection only — there is no manual switcher.
(function () {
  const T = {
    zh: { title:'mdog的生日会', lbl:'正在前往', world:'mdog的生日会',
          calendar:'添加到 Google 日历', soundOn:'关闭声音', soundOff:'开启声音', soundErr:'无音频',
          birthday:'🎉 生日快乐！', countdown:(d,h,m,s)=>`还有 ${d} 天 ${h}:${m}:${s}` },
    en: { title:"mdog's Birthday Party", lbl:'Traveling to', world:"mdog's Birthday Party",
          calendar:'Add to Google Calendar', soundOn:'Mute', soundOff:'Enable sound', soundErr:'No audio',
          birthday:'🎉 Happy Birthday!', countdown:(d,h,m,s)=>`${d}d ${h}:${m}:${s} left` },
    ja: { title:'mdogの誕生日会', lbl:'移動中', world:'mdogの誕生日会',
          calendar:'Google カレンダーに追加', soundOn:'ミュート', soundOff:'音を出す', soundErr:'音声なし',
          birthday:'🎉 お誕生日おめでとう！', countdown:(d,h,m,s)=>`あと ${d}日 ${h}:${m}:${s}` },
  };
  const nav = ((navigator.languages && navigator.languages[0]) || navigator.language || 'en').toLowerCase();
  const lang = nav.startsWith('zh') ? 'zh' : nav.startsWith('ja') ? 'ja' : 'en';
  const t = T[lang];
  window.__LANG = lang; window.__T = t;

  document.documentElement.lang = lang;
  document.title = t.title;
  const set = (sel, v) => { const el = document.querySelector(sel); if (el) el.textContent = v; };
  set('#info .titles .lbl', t.lbl);
  set('#info .titles .world', t.world);
  set('#back .tx', t.calendar);
  set('#sound .tx', t.soundOff);

  // Reveal the panel only after the background has painted its first frame AND
  // the Noto Emoji glyphs (🏃 🔊 🔇 ⚠ 📅) are loaded, so nothing pops in late.
  // A safety timeout guarantees the panel shows even if WebGL or fonts fail.
  const panel = document.getElementById('panel');
  const fontReady = (document.fonts && document.fonts.load)
    ? document.fonts.load("16px 'Noto Emoji'", "🏃🔊🔇⚠📅").then(() => document.fonts.ready).catch(() => {})
    : Promise.resolve();
  const bgReady = new Promise((resolve) => { window.__bgReady = resolve; });
  const safety = new Promise((resolve) => setTimeout(resolve, 5000));
  Promise.race([Promise.all([fontReady, bgReady]), safety])
    .then(() => panel.classList.add('ready'));
})();
</script>

<script>
// The progress bar is repurposed as a countdown to mdog's birthday party.
(function () {
  // Target: 2026-07-01 23:00 in UTC+8 (the party, shown in the countdown).
  // The bar fills over a fixed window: starts 2026-06-18, full at 2026-07-02.
  const TARGET    = Date.parse('2026-07-01T23:00:00+08:00');
  const BAR_START = Date.parse('2026-06-18T00:00:00+08:00');
  const BAR_END   = Date.parse('2026-07-02T00:00:00+08:00');
  const TARGET_LABEL = '2026-07-01 23:00 (UTC+8)';

  const fill   = document.getElementById('fill');
  const pctEl  = document.querySelector('#stats .pct');
  const sizeEl = document.querySelector('#stats .size');

  // Keep the horizontal layout intact and just scale the whole panel down to
  // fit narrow screens (like the real VRChat overlay). offsetWidth/Height stay
  // at the unscaled layout size, so this is stable across resizes.
  const panel = document.getElementById('panel');
  function fitPanel() {
    const margin = 24;
    const s = Math.min(1,
      (innerWidth  - margin) / panel.offsetWidth,
      (innerHeight - margin) / panel.offsetHeight);
    panel.style.setProperty('--s', s);
  }
  addEventListener('resize', fitPanel);
  addEventListener('orientationchange', fitPanel);
  fitPanel();

  const pad = (n) => String(n).padStart(2, '0');
  function tick() {
    const now = Date.now();
    const remain = TARGET - now;

    // Bar: fraction of the fixed 2026-06-18 → 2026-07-02 window, clamped 0..100.
    const pct = Math.min(100, Math.max(0, (now - BAR_START) / (BAR_END - BAR_START) * 100));
    fill.style.width = pct.toFixed(2) + '%';

    const T = window.__T;
    if (remain <= 0) {
      pctEl.textContent = T.birthday;
      fill.style.width = '100%';
    } else {
      const sec = Math.floor(remain / 1000);
      const days = Math.floor(sec / 86400);
      const h = Math.floor((sec % 86400) / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = sec % 60;
      pctEl.textContent = T.countdown(days, pad(h), pad(m), pad(s));
    }
    sizeEl.textContent = TARGET_LABEL;
  }
  tick();
  setInterval(tick, 1000);
})();
</script>

<script type="module">
import * as THREE from 'three';
import { OBJLoader } from './vendor/jsm/loaders/OBJLoader.js';

// ===========================================================================
// Assets extracted from loading.assetbundle (web/assets/). Each loads with a
// graceful fallback so the scene still runs if a (VRChat-owned) file is absent.
//
// The real PC loading screen has a FIXED view: the background (starfield +
// nebulae) never rotates, the warm nebula sits in the bottom-right, and only
// the warp tunnel streaks + fine stars move toward the camera.
//
//   Stars-010-Cyan.png   -> the deep starfield, mapped onto a background sphere
//   Nebula-*.png         -> coloured cloud billboards, ADDITIVE (black = clear)
//   Default-Particle.png -> tiny soft round sprite for the fine drifting stars
//   warp_tunnel_mask.png -> scrolling streaks radiating from the centre
// ===========================================================================
const BASE = './assets/';
const texLoader = new THREE.TextureLoader();
const loadTex = (file) => new Promise((res) =>
  texLoader.load(BASE + encodeURIComponent(file), (t) => res(t), undefined, () => res(null)));

const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
// Fixed camera: looks straight down -Z and never rotates. World +X is screen
// right, +Y is screen up, so anything at (+x, -y, -z) lands in the bottom-right.
const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 4000);

// ---------------------------------------------------------------------------
// 1. Starfield sky — tileable Stars-010-Cyan on a big inward sphere. Static.
// ---------------------------------------------------------------------------
async function buildSky() {
  const star = await loadTex('Stars-010-Cyan.png');
  let mat;
  if (star) {
    star.colorSpace = THREE.SRGBColorSpace;
    star.wrapS = star.wrapT = THREE.RepeatWrapping;
    star.repeat.set(2, 1);
    mat = new THREE.MeshBasicMaterial({ map: star, side: THREE.BackSide, fog: false });
  } else {
    mat = new THREE.ShaderMaterial({
      side: THREE.BackSide,
      uniforms: { top: { value: new THREE.Color(0x0b2238) }, bottom: { value: new THREE.Color(0x01010a) } },
      vertexShader: `varying vec3 vp; void main(){ vp=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);} `,
      fragmentShader: `varying vec3 vp; uniform vec3 top; uniform vec3 bottom;
        void main(){ float h=normalize(vp).y*0.5+0.5; gl_FragColor=vec4(mix(bottom,top,h),1.0);} `,
    });
  }
  scene.add(new THREE.Mesh(new THREE.SphereGeometry(1000, 48, 48), mat));
}

// ---------------------------------------------------------------------------
// 2. Nebula clouds — additive billboards. Warm tones gathered in the lower
//    right (matching the real screen); everything else stays clean/dark.
// ---------------------------------------------------------------------------
async function buildNebulae() {
  const files = {
    orange: 'Nebula-004-Bright-01-DarkMatterOrange.png',
    orange2: 'Nebula-004-Dark-02-DarkMatterOrange.png',
    red:    'Nebula-003-Bright-01-DarkMatterRed.png',
    blue:   'Nebula-001-CloudyBlue-Medium-03.png',
  };
  const tex = {};
  await Promise.all(Object.entries(files).map(async ([k, f]) => { tex[k] = await loadTex(f); }));

  // [texture key, direction (x,y,z), scale, opacity, texture-rotation]
  // Warm glow fills roughly the whole bottom-right quarter, fading along the bottom.
  const clouds = [
    ['orange',  [ 0.62, -0.52, -0.58], 1500, 1.0,  0.2],   // main warm glow, bottom-right
    ['orange2', [ 0.30, -0.66, -0.62], 1150, 0.7,  1.7],   // extends warmth along the bottom
    ['red',     [-0.40, -0.60, -0.66],  820, 0.3,  2.6],   // faint warmth, bottom-left
    ['blue',    [-0.55,  0.42, -0.72],  520, 0.18, 1.1],   // very faint cool tint, upper-left
  ];
  for (const [key, dir, scale, opacity, rot] of clouds) {
    const t = tex[key];
    if (!t) continue;
    t.colorSpace = THREE.SRGBColorSpace;
    const spr = new THREE.Sprite(new THREE.SpriteMaterial({
      map: t, blending: THREE.AdditiveBlending, depthWrite: false, depthTest: false,
      opacity, rotation: rot, transparent: true,
    }));
    spr.position.set(...dir).normalize().multiplyScalar(820);
    spr.scale.set(scale, scale, 1);
    scene.add(spr);
  }
}

// ---------------------------------------------------------------------------
// 3. Warp tunnel — scrolling streaks down the view axis, radiating from the
//    dark centre. warp_tunnel_mask falls back to a procedural streak canvas.
// ---------------------------------------------------------------------------
function proceduralTunnelTex() {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d'); g.fillStyle = '#000'; g.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 60; i++) {
    const x = Math.random() * 256, w = 1 + Math.random() * 3, a = 0.1 + Math.random() * 0.4;
    const grd = g.createLinearGradient(x, 0, x, 256);
    grd.addColorStop(0, 'rgba(150,200,255,0)'); grd.addColorStop(0.5, `rgba(150,200,255,${a})`);
    grd.addColorStop(1, 'rgba(150,200,255,0)');
    g.fillStyle = grd; g.fillRect(x, 0, w, 256);
  }
  return new THREE.CanvasTexture(c);
}
// Faithful recreation of FORGE3D/WarpTunnel. Disassembling the bundle's compiled
// DX11 shader (see web/extract_dxbc.py) shows it does almost nothing — the vertex
// stage is a plain transform and the fragment stage is just:
//     uv  = texcoord + (cb0[2].y + _Time.y) * (Ufac, Vfac)   // pan
//     rgb = tex(uv).rgb * nodeColor                           // tint
//     a   = Opacity
// There is NO wiggle/curve math in the shader. ALL of the curved + straight,
// never-repeating streaks come from the real mesh (Editable_Poly — a flared horn
// tube, radius ~2 at the far end to ~79 at the near end, UVs baked 2x around /
// 10x along) plus the organic warp_tunnel_mask texture panned over it. So we load
// the actual mesh and reproduce that tiny shader exactly.
// The original renders the tube as two "Warp Tunnel" mask-streak copies (for
// density). We reproduce that with two streak layers at slightly different
// scale + phase + roll so they never line up. (The makeTunnelMat shader keeps an
// unused uMode=1 distortion branch in case the normal-map layer is wanted again.)
const VIEW_AXIS = new THREE.Vector3(0, 0, 1);
const tunnelLayers = [];   // { uniforms, mesh }

function makeTunnelMat(o) {
  const u = {
    map:    { value: o.map },
    uTime:  { value: o.phase || 0 },
    uPan:   { value: o.pan },
    uSpeed: { value: o.speed },
    uColor: { value: new THREE.Color(o.color) },
    uOpacity:{ value: o.opacity },
    uFade:  { value: new THREE.Vector2(40.0, 900.0) },
    uMode:  { value: o.mode || 0 },              // 0 = mask streaks, 1 = normal-map filaments
  };
  return new THREE.ShaderMaterial({
    uniforms: u, transparent: true, depthWrite: false,
    blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
    vertexShader: `
      varying vec2 vUv; varying float vDist;
      void main(){
        vUv = uv;
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        vDist = -mv.z;
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: `
      uniform sampler2D map; uniform float uTime,uSpeed,uOpacity,uMode;
      uniform vec2 uPan,uFade; uniform vec3 uColor;
      varying vec2 vUv; varying float vDist;
      void main(){
        vec2 uv = vUv + uPan * (uTime * uSpeed);
        vec4 t = texture2D(map, uv);
        float i = (uMode > 0.5)
          ? length(t.rg - 0.5) * 2.0      // normal-map deviation -> wispy filaments
          : t.r;                          // mask streaks
        float fade = 1.0 - smoothstep(uFade.x, uFade.y, vDist);
        gl_FragColor = vec4(uColor * i * uOpacity * fade, 1.0);  // additive
      }`,
  });
}

async function buildTunnel() {
  const mask = (await loadTex('warp_tunnel_mask.png')) || proceduralTunnelTex();
  mask.wrapS = mask.wrapT = THREE.RepeatWrapping;

  const root = await new Promise((res) =>
    new OBJLoader().load(BASE + 'warp_tunnel.obj', res, undefined, () => res(null)));
  let geo = null;
  root && root.traverse((c) => { if (c.isMesh) geo = c.geometry; });
  if (!geo) geo = new THREE.CylinderGeometry(4, 79, 7520, 64, 1, true).rotateZ(Math.PI / 2);

  // Two streak layers only (no distortion layer): different scale/phase/roll so
  // they add density without lining up.
  // [material opts, scale(cross), z-rotation phase]
  const layers = [
    { mat: { map: mask, pan: new THREE.Vector2(0.105, 0.52), speed: -0.5, color: 0x14bbff, opacity: 1.4, phase: 0,   mode: 0 }, cross: 0.213, rot: 0.0 },
    { mat: { map: mask, pan: new THREE.Vector2(0.105, 0.52), speed: -0.5, color: 0x86d2ff, opacity: 0.8, phase: 4.7, mode: 0 }, cross: 0.205, rot: 0.9 },
  ];
  for (const L of layers) {
    const mat = makeTunnelMat(L.mat);
    const mesh = new THREE.Mesh(geo, mat);       // geometry shared across layers
    mesh.rotation.y = Math.PI / 2;               // mesh long axis X -> view axis Z
    mesh.rotateOnWorldAxis(VIEW_AXIS, L.rot);    // roll around the axis so layers don't line up
    mesh.scale.set(0.16, L.cross, L.cross);      // non-uniform: cross ~1.33x length
    mesh.position.z = -480;
    scene.add(mesh);
    tunnelLayers.push({ uniforms: mat.uniforms, mesh });
  }
}

// ---------------------------------------------------------------------------
// 4. Stars flying toward the camera. The real Stars system renders STRETCHED
//    (renderMode = Stretch, lengthScale 4.5), so each star is a streak, not a
//    dot. We draw them as additive line segments (head bright -> tail dark),
//    sparse, each with its own length, brightness (mostly dim) and a random
//    colour between pink-purple and cyan (the real startColor range).
// ---------------------------------------------------------------------------
const STAR_COUNT = 300, DEPTH = 1100, SPREAD = 320, MIN_R = 18, STREAK = 5;
const linePos = new Float32Array(STAR_COUNT * 6);   // 2 verts (head, tail) per star
const lineCol = new Float32Array(STAR_COUNT * 6);
const speeds = new Float32Array(STAR_COUNT);
const tailLen = new Float32Array(STAR_COUNT);
const STAR_PINK = new THREE.Color(0.867, 0.388, 1.0);
const STAR_CYAN = new THREE.Color(0.596, 0.984, 1.0);
const _c = new THREE.Color();
function placeStar(i, full) {
  const a = Math.random() * Math.PI * 2;
  const r = MIN_R + Math.sqrt(Math.random()) * SPREAD;   // area-uniform, biased outward
  const x = Math.cos(a) * r, y = Math.sin(a) * r;
  const z = full ? -Math.random() * DEPTH : -DEPTH;
  if (full) {                                            // set once; constant per star
    speeds[i]  = 0.4 + Math.random() * 1.0;              // wide spread, like startSpeed 5-75
    tailLen[i] = STREAK * speeds[i];                     // faster -> longer streak (Stretch)
    const bright = Math.pow(Math.random(), 2.2);         // mostly dim, a few bright
    _c.copy(STAR_PINK).lerp(STAR_CYAN, Math.random());   // random pink..cyan
    const h = i * 6;
    lineCol[h]   = _c.r * bright; lineCol[h+1] = _c.g * bright; lineCol[h+2] = _c.b * bright;
    lineCol[h+3] = 0; lineCol[h+4] = 0; lineCol[h+5] = 0; // tail fades to nothing
  }
  const p = i * 6;
  linePos[p]   = x; linePos[p+1] = y; linePos[p+2] = z;              // head (leading)
  linePos[p+3] = x; linePos[p+4] = y; linePos[p+5] = z - tailLen[i]; // tail (trailing in +z)
}
for (let i = 0; i < STAR_COUNT; i++) placeStar(i, true);
const starGeo = new THREE.BufferGeometry();
starGeo.setAttribute('position', new THREE.BufferAttribute(linePos, 3));
starGeo.setAttribute('color', new THREE.BufferAttribute(lineCol, 3));
const starMat = new THREE.LineBasicMaterial({ vertexColors: true, transparent: true,
  blending: THREE.AdditiveBlending, depthWrite: false, depthTest: false });
const stars = new THREE.LineSegments(starGeo, starMat);
scene.add(stars);

// ---------------------------------------------------------------------------
// Audio — PartiallyOffline loop. Plays automatically; the button mutes it.
// If the browser blocks autoplay, fall back to start-on-click.
// ---------------------------------------------------------------------------
const soundBtn = document.getElementById('sound');
const soundIc  = soundBtn.querySelector('.ic');
const soundTx  = soundBtn.querySelector('.tx');
const music = new Audio(BASE + encodeURIComponent('PartiallyOffline.wav'));
music.loop = true; music.volume = 0.6;

const T = window.__T;
const showPlaying = () => { soundIc.textContent = '🔊'; soundTx.textContent = T.soundOn; };
const showMuted   = () => { soundIc.textContent = '🔇'; soundTx.textContent = T.soundOff; };
const showError   = () => { soundIc.textContent = '⚠'; soundTx.textContent = T.soundErr; };
// Reflect whatever state playback actually ended up in (play() can resolve muted).
const syncLabel   = () => { music.paused ? showMuted() : showPlaying(); };

// Try to autoplay immediately; browsers may reject until a user gesture.
music.play().then(syncLabel).catch(() => {
  showMuted();
  const kick = () => {            // first interaction unblocks playback
    music.play().then(syncLabel).catch(showError);
    window.removeEventListener('pointerdown', kick);
    window.removeEventListener('keydown', kick);
  };
  window.addEventListener('pointerdown', kick);
  window.addEventListener('keydown', kick);
});
// Keep the label honest if the browser pauses/resumes on its own.
music.addEventListener('play', showPlaying);
music.addEventListener('pause', showMuted);

soundBtn.addEventListener('click', (e) => {
  e.stopPropagation();           // don't let the autoplay "kick" handler also fire
  if (music.paused) music.play().then(syncLabel).catch(showError);
  else music.pause();
});

// ---------------------------------------------------------------------------
// Boot + animation loop. Nothing rotates; only the tunnel scrolls and the
// stars stream toward the camera.
// ---------------------------------------------------------------------------
await Promise.all([buildSky(), buildNebulae(), buildTunnel()]);

const STAR_SPEED = 90;   // ~13s to cross DEPTH, matching the real startLifetime
const clock = new THREE.Clock();
let firstFrame = true;
function animate() {
  const dt = Math.min(clock.getDelta(), 0.05);
  for (const L of tunnelLayers) {                       // pan + gentle swirl, per layer
    L.uniforms.uTime.value += dt;
    L.mesh.rotateOnWorldAxis(VIEW_AXIS, dt * 0.03);
  }

  for (let i = 0; i < STAR_COUNT; i++) {
    const p = i * 6, dz = STAR_SPEED * speeds[i] * dt;
    linePos[p+2] += dz; linePos[p+5] += dz;            // move head + tail toward camera
    if (linePos[p+2] > 2) placeStar(i, false);          // recycle once the head passes
  }
  starGeo.attributes.position.needsUpdate = true;

  renderer.render(scene, camera);
  if (firstFrame) {                 // background has painted — let the panel fade in
    firstFrame = false;
    if (window.__bgReady) window.__bgReady();
  }
  requestAnimationFrame(animate);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
