<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BetterLoadingScreen — Web Recreation</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font-family: system-ui, sans-serif; }
  #app { position: fixed; inset: 0; }

  #overlay {
    position: fixed; inset: 0; pointer-events: none;
    display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    padding: 8vh 0; box-sizing: border-box;
  }
  #logo {
    color: #cfefff; font-weight: 800; letter-spacing: .35em; font-size: clamp(22px, 4vw, 48px);
    text-shadow: 0 0 18px rgba(90,180,255,.9), 0 0 40px rgba(40,120,255,.5);
  }
  #info {
    color: #bfe6ff; font-size: clamp(12px, 1.6vw, 16px); letter-spacing: .08em; text-align: center;
    text-shadow: 0 0 10px rgba(80,160,255,.7);
  }
  #bar { width: min(420px, 70vw); height: 4px; margin-top: 14px; border-radius: 4px;
         background: rgba(120,180,255,.15); overflow: hidden; }
  #bar > div { height: 100%; width: 35%; border-radius: 4px;
         background: linear-gradient(90deg, #2a6cff, #7fd4ff);
         box-shadow: 0 0 12px #4aa0ff; animation: load 2.4s ease-in-out infinite; }
  @keyframes load { 0%{transform:translateX(-120%)} 100%{transform:translateX(320%)} }

  #sound { pointer-events: auto; position: fixed; right: 16px; bottom: 16px;
    background: rgba(20,40,70,.6); color: #cfefff; border: 1px solid rgba(120,180,255,.4);
    padding: 8px 14px; border-radius: 8px; font-size: 13px; cursor: pointer; backdrop-filter: blur(4px); }
  #sound:hover { background: rgba(40,80,140,.7); }
</style>
</head>
<body>
<div id="app"></div>

<div id="overlay">
  <div id="logo">V R C H A T</div>
  <div>
    <div id="info">Connecting to the warp tunnel…</div>
    <div id="bar"><div></div></div>
  </div>
  <button id="sound">🔊 Enable sound</button>
</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';
import { OBJLoader } from 'https://unpkg.com/three@0.160.0/examples/jsm/loaders/OBJLoader.js';

// ===========================================================================
// Assets extracted from loading.assetbundle (web/assets/). Each loads with a
// graceful fallback so the scene still runs if a (VRChat-owned) file is absent.
//
// The real PC loading screen has a FIXED view: the background (starfield +
// nebulae) never rotates, the warm nebula sits in the bottom-right, and only
// the warp tunnel streaks + fine stars move toward the camera.
//
//   Stars-010-Cyan.png   -> the deep starfield, mapped onto a background sphere
//   Nebula-*.png         -> coloured cloud billboards, ADDITIVE (black = clear)
//   Default-Particle.png -> tiny soft round sprite for the fine drifting stars
//   warp_tunnel_mask.png -> scrolling streaks radiating from the centre
// ===========================================================================
const BASE = './assets/';
const texLoader = new THREE.TextureLoader();
const loadTex = (file) => new Promise((res) =>
  texLoader.load(BASE + encodeURIComponent(file), (t) => res(t), undefined, () => res(null)));

const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
// Fixed camera: looks straight down -Z and never rotates. World +X is screen
// right, +Y is screen up, so anything at (+x, -y, -z) lands in the bottom-right.
const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 4000);

// ---------------------------------------------------------------------------
// 1. Starfield sky — tileable Stars-010-Cyan on a big inward sphere. Static.
// ---------------------------------------------------------------------------
async function buildSky() {
  const star = await loadTex('Stars-010-Cyan.png');
  let mat;
  if (star) {
    star.colorSpace = THREE.SRGBColorSpace;
    star.wrapS = star.wrapT = THREE.RepeatWrapping;
    star.repeat.set(2, 1);
    mat = new THREE.MeshBasicMaterial({ map: star, side: THREE.BackSide, fog: false });
  } else {
    mat = new THREE.ShaderMaterial({
      side: THREE.BackSide,
      uniforms: { top: { value: new THREE.Color(0x0b2238) }, bottom: { value: new THREE.Color(0x01010a) } },
      vertexShader: `varying vec3 vp; void main(){ vp=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);} `,
      fragmentShader: `varying vec3 vp; uniform vec3 top; uniform vec3 bottom;
        void main(){ float h=normalize(vp).y*0.5+0.5; gl_FragColor=vec4(mix(bottom,top,h),1.0);} `,
    });
  }
  scene.add(new THREE.Mesh(new THREE.SphereGeometry(1000, 48, 48), mat));
}

// ---------------------------------------------------------------------------
// 2. Nebula clouds — additive billboards. Warm tones gathered in the lower
//    right (matching the real screen); everything else stays clean/dark.
// ---------------------------------------------------------------------------
async function buildNebulae() {
  const files = {
    orange: 'Nebula-004-Bright-01-DarkMatterOrange.png',
    orange2: 'Nebula-004-Dark-02-DarkMatterOrange.png',
    red:    'Nebula-003-Bright-01-DarkMatterRed.png',
    blue:   'Nebula-001-CloudyBlue-Medium-03.png',
  };
  const tex = {};
  await Promise.all(Object.entries(files).map(async ([k, f]) => { tex[k] = await loadTex(f); }));

  // [texture key, direction (x,y,z), scale, opacity, texture-rotation]
  // Warm glow fills roughly the whole bottom-right quarter, fading along the bottom.
  const clouds = [
    ['orange',  [ 0.62, -0.52, -0.58], 1500, 1.0,  0.2],   // main warm glow, bottom-right
    ['orange2', [ 0.30, -0.66, -0.62], 1150, 0.7,  1.7],   // extends warmth along the bottom
    ['red',     [-0.40, -0.60, -0.66],  820, 0.3,  2.6],   // faint warmth, bottom-left
    ['blue',    [-0.55,  0.42, -0.72],  520, 0.18, 1.1],   // very faint cool tint, upper-left
  ];
  for (const [key, dir, scale, opacity, rot] of clouds) {
    const t = tex[key];
    if (!t) continue;
    t.colorSpace = THREE.SRGBColorSpace;
    const spr = new THREE.Sprite(new THREE.SpriteMaterial({
      map: t, blending: THREE.AdditiveBlending, depthWrite: false, depthTest: false,
      opacity, rotation: rot, transparent: true,
    }));
    spr.position.set(...dir).normalize().multiplyScalar(820);
    spr.scale.set(scale, scale, 1);
    scene.add(spr);
  }
}

// ---------------------------------------------------------------------------
// 3. Warp tunnel — scrolling streaks down the view axis, radiating from the
//    dark centre. warp_tunnel_mask falls back to a procedural streak canvas.
// ---------------------------------------------------------------------------
function proceduralTunnelTex() {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d'); g.fillStyle = '#000'; g.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 60; i++) {
    const x = Math.random() * 256, w = 1 + Math.random() * 3, a = 0.1 + Math.random() * 0.4;
    const grd = g.createLinearGradient(x, 0, x, 256);
    grd.addColorStop(0, 'rgba(150,200,255,0)'); grd.addColorStop(0.5, `rgba(150,200,255,${a})`);
    grd.addColorStop(1, 'rgba(150,200,255,0)');
    g.fillStyle = grd; g.fillRect(x, 0, w, 256);
  }
  return new THREE.CanvasTexture(c);
}
// Faithful recreation of FORGE3D/WarpTunnel. Disassembling the bundle's compiled
// DX11 shader (see web/extract_dxbc.py) shows it does almost nothing — the vertex
// stage is a plain transform and the fragment stage is just:
//     uv  = texcoord + (cb0[2].y + _Time.y) * (Ufac, Vfac)   // pan
//     rgb = tex(uv).rgb * nodeColor                           // tint
//     a   = Opacity
// There is NO wiggle/curve math in the shader. ALL of the curved + straight,
// never-repeating streaks come from the real mesh (Editable_Poly — a flared horn
// tube, radius ~2 at the far end to ~79 at the near end, UVs baked 2x around /
// 10x along) plus the organic warp_tunnel_mask texture panned over it. So we load
// the actual mesh and reproduce that tiny shader exactly.
const tunnelUniforms = {
  map:      { value: null },
  uTime:    { value: 0 },
  uPan:     { value: new THREE.Vector2(0.105, 0.52) },   // _U/_V_TileAnimFactor
  uSpeed:   { value: 1.0 },                              // overall pan rate
  uColor:   { value: new THREE.Color(0x14bbff) },        // node_6523 rgb(0.08,0.73,1.0)
  uOpacity: { value: 1.6 },                              // _Opacity 0.157, scaled up for additive
  uFade:    { value: new THREE.Vector2(40.0, 900.0) },   // dark-centre distance fade (~_MaxFade)
};
const tunnelMat = new THREE.ShaderMaterial({
  uniforms: tunnelUniforms, transparent: true, depthWrite: false,
  blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
  vertexShader: `
    varying vec2 vUv; varying float vDist;
    void main(){
      vUv = uv;
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      vDist = -mv.z;
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: `
    uniform sampler2D map; uniform float uTime,uSpeed,uOpacity;
    uniform vec2 uPan,uFade; uniform vec3 uColor;
    varying vec2 vUv; varying float vDist;
    void main(){
      vec2 uv = vUv + uPan * (uTime * uSpeed);          // the shader's only real work
      vec3 col = texture2D(map, uv).rgb * uColor;
      float fade = 1.0 - smoothstep(uFade.x, uFade.y, vDist);
      gl_FragColor = vec4(col * uOpacity * fade, 1.0);  // additive
    }`,
});
const VIEW_AXIS = new THREE.Vector3(0, 0, 1);
let tunnel = null;        // set once the mesh loads

async function buildTunnel() {
  const tex = (await loadTex('warp_tunnel_mask.png')) || proceduralTunnelTex();
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tunnelUniforms.map.value = tex;

  const root = await new Promise((res) =>
    new OBJLoader().load(BASE + 'warp_tunnel.obj', res, undefined, () => res(null)));
  let geo = null;
  root && root.traverse((c) => { if (c.isMesh) geo = c.geometry; });
  if (!geo) {                                   // fallback: a flared cone
    geo = new THREE.CylinderGeometry(4, 79, 7520, 64, 1, true).rotateZ(Math.PI / 2);
  }
  tunnel = new THREE.Mesh(geo, tunnelMat);
  // The mesh's long axis is X (±3760), radius ~79 near / ~2 far. Aim it down the
  // -Z view axis and scale it down so the wide end sits around the camera.
  tunnel.rotation.y = Math.PI / 2;              // X -> Z
  tunnel.scale.setScalar(0.16);                 // ~1200 long in scene units
  tunnel.position.z = -480;                     // camera near the wide rim, narrow end far
  scene.add(tunnel);
}

// ---------------------------------------------------------------------------
// 4. Fine stars flying toward the camera. Distributed across a wide ring (the
//    centre is left empty so they never pile into a bright ball), with random
//    depth + per-star speed so there is no banding. Tiny, uniform pixel size.
// ---------------------------------------------------------------------------
const STAR_COUNT = 900, DEPTH = 1100, SPREAD = 320, MIN_R = 18;
const positions = new Float32Array(STAR_COUNT * 3);
const speeds = new Float32Array(STAR_COUNT);
function placeStar(i, full) {
  const a = Math.random() * Math.PI * 2;
  const r = MIN_R + Math.sqrt(Math.random()) * SPREAD;   // area-uniform, biased outward
  positions[i*3]   = Math.cos(a) * r;
  positions[i*3+1] = Math.sin(a) * r;
  positions[i*3+2] = full ? -Math.random() * DEPTH : -DEPTH;
  speeds[i] = 0.7 + Math.random() * 0.6;
}
for (let i = 0; i < STAR_COUNT; i++) placeStar(i, true);
const starGeo = new THREE.BufferGeometry();
starGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
const starMat = new THREE.PointsMaterial({ color: 0xeaf4ff, size: 4.5, sizeAttenuation: false,
  transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, depthTest: false });
const stars = new THREE.Points(starGeo, starMat);
scene.add(stars);
loadTex('Default-Particle.png').then((t) => {
  if (t) { starMat.map = t; starMat.needsUpdate = true; }
});

// ---------------------------------------------------------------------------
// Audio — PartiallyOffline loop, started on first user gesture (autoplay policy).
// ---------------------------------------------------------------------------
const soundBtn = document.getElementById('sound');
const music = new Audio(BASE + encodeURIComponent('PartiallyOffline.wav'));
music.loop = true; music.volume = 0.6;
soundBtn.addEventListener('click', () => {
  if (music.paused) { music.play().then(() => soundBtn.textContent = '🔈 Mute')
    .catch(() => soundBtn.textContent = '⚠ no audio file'); }
  else { music.pause(); soundBtn.textContent = '🔊 Enable sound'; }
});

// ---------------------------------------------------------------------------
// Boot + animation loop. Nothing rotates; only the tunnel scrolls and the
// stars stream toward the camera.
// ---------------------------------------------------------------------------
await Promise.all([buildSky(), buildNebulae(), buildTunnel()]);

const STAR_SPEED = 240;
const clock = new THREE.Clock();
function animate() {
  const dt = Math.min(clock.getDelta(), 0.05);
  tunnelUniforms.uTime.value += dt;                    // pans the mask down the tube
  if (tunnel) tunnel.rotateOnWorldAxis(VIEW_AXIS, dt * 0.05);   // gentle swirl (F3DWarpTunnel)

  for (let i = 0; i < STAR_COUNT; i++) {
    positions[i*3+2] += STAR_SPEED * speeds[i] * dt;   // fly toward the camera
    if (positions[i*3+2] > 2) placeStar(i, false);     // recycle once past it
  }
  starGeo.attributes.position.needsUpdate = true;

  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
